  <path d="M500 440c27 22 38 48 29 77-8 26-30 40-32 67-2 38 49 51 44 88-3 25-30 40-24 72 2 11 9 21 18 31" fill="none" stroke="url(#river)" stroke-width="46" stroke-linecap="round" opacity=".9"/>
  <path d="M500 440c27 22 38 48 29 77-8 26-30 40-32 67-2 38 49 51 44 88-3 25-30 40-24 72" fill="none" stroke="#82bdb3" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="5 8"/>

  <!-- road network -->
  <g fill="none" stroke="#b8b69d" stroke-opacity=".25" stroke-width="2">
    <path d="M70 686C145 630 215 596 274 557c62-41 91-72 139-94 41-19 86-21 131-18 62 4 101 34 158 62 54 27 104 60 165 62 58 2 110-22 164-49 57-29 106-27 154-19"/>
    <path d="M306 292c66 23 109 57 168 71 61 15 127 1 191 16 51 12 78 38 130 38"/>
    <path d="M574 420c-5-65 8-111 38-158 27-43 38-89 34-142"/>
    <path d="M743 437c52-58 83-108 107-169 20-51 57-83 100-98"/>
    <path d="M315 553c-36 58-53 104-52 156"/>
