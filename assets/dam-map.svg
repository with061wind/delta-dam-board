  </g>
  <g fill="#f4c572" font-family="'Cascadia Mono','Consolas',monospace" font-size="10" letter-spacing="2">
    <text x="414" y="383">DAM WALL / 主坝结构</text>
    <text x="735" y="481">GATE 03</text>
  </g>
  <circle cx="584" cy="423" r="52" fill="url(#sectorGlow)"/>
  <circle cx="584" cy="423" r="9" fill="#e3a34d" fill-opacity=".95"/>
  <circle cx="584" cy="423" r="19" fill="none" stroke="#e3a34d" stroke-opacity=".5"/>
  <circle cx="584" cy="423" r="31" fill="none" stroke="#e3a34d" stroke-opacity=".16"/>
  <text x="608" y="414" fill="#f4dfb7" font-family="'Microsoft YaHei UI','Segoe UI',sans-serif" font-size="20" font-weight="700">零号大坝</text>
  <text x="609" y="432" fill="#e3a34d" fill-opacity=".8" font-family="'Cascadia Mono','Consolas',monospace" font-size="8.5" letter-spacing="1.8">ZERO DAM · PRIMARY</text>

