      <text x="12" y="23" fill="#e6e2d2" font-size="14" font-weight="700">码头</text>
      <text x="12" y="39" fill="#b9bca8" font-size="8" letter-spacing="1">DOCKS</text>
      <path d="M89 14v18h14M89 23h-7" fill="none" stroke="#65b6a1" stroke-opacity=".65"/>
    </g>
    <g transform="translate(576 552)">
      <rect width="176" height="58" fill="#d7ddc8" fill-opacity=".03" stroke="#c8cfb9" stroke-opacity=".2"/>
      <text x="12" y="24" fill="#e6e2d2" font-size="14" font-weight="700">地下通道</text>
      <text x="12" y="41" fill="#b9bca8" font-size="8" letter-spacing="1">UNDERGROUND PASSAGE</text>
