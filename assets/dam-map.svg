      <text x="13" y="25" fill="#e6e2d2" font-size="15" font-weight="700">军营</text>
      <text x="13" y="43" fill="#b9bca8" font-size="8.5" letter-spacing="1">BARRACKS</text>
      <g fill="#d7ddc8" fill-opacity=".25">
        <rect x="107" y="14" width="8" height="8"/><rect x="120" y="14" width="8" height="8"/><rect x="133" y="14" width="8" height="8"/>
        <rect x="107" y="27" width="8" height="8"/><rect x="120" y="27" width="8" height="8"/><rect x="133" y="27" width="8" height="8"/>
      </g>
    </g>
    <g transform="translate(212 526)">
      <rect width="150" height="62" fill="#d7ddc8" fill-opacity=".03" stroke="#c8cfb9" stroke-opacity=".2"/>
      <text x="13" y="25" fill="#e6e2d2" font-size="15" font-weight="700">水泥厂</text>
      <text x="13" y="43" fill="#b9bca8" font-size="8.5" letter-spacing="1">CEMENT WORKS</text>
