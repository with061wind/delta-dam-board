<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">零号大坝战术地图</title>
  <desc id="mapDesc">一张用于本地编成记录的零号大坝风格战术地图，标注大坝、行政楼、电站、军营、水泥厂、游客中心、码头和地下通道。</desc>
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b120e"/>
      <stop offset="0.55" stop-color="#111a14"/>
      <stop offset="1" stop-color="#0a100d"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1d4646"/>
      <stop offset="0.55" stop-color="#173c3c"/>
      <stop offset="1" stop-color="#102c2d"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4a48"/>
      <stop offset="1" stop-color="#102d2f"/>
    </linearGradient>
    <linearGradient id="damWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e672e"/>
      <stop offset="0.5" stop-color="#e7ab4d"/>
      <stop offset="1" stop-color="#8e672e"/>
    </linearGradient>
    <radialGradient id="sectorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e3a34d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e3a34d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d9e1c8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#d9e1c8" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#d7dec9" fill-opacity=".08"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#mapBg)"/>
  <rect width="1200" height="760" fill="url(#grid)"/>
  <rect width="1200" height="760" fill="url(#gridMajor)"/>
  <rect width="1200" height="760" fill="url(#dots)" opacity=".7"/>

  <!-- terrain contours -->
  <g fill="none" stroke="#9caf91" stroke-opacity=".13" stroke-width="1.2">
    <path d="M-40 120C55 72 142 86 188 146c35 46 17 99 59 139 43 41 114 18 137 71 20 46-24 89-72 99-82 17-152-34-232-2"/>
    <path d="M-20 168C60 130 121 143 156 190c31 41 13 88 49 121 40 37 99 19 117 64 16 40-25 70-66 77-72 13-136-31-207-4"/>
    <path d="M3 218C66 187 108 198 134 237c26 38 8 75 38 104 31 30 78 16 92 52 12 31-20 52-52 58-57 11-111-25-170-5"/>
    <path d="M944 -30C896 34 909 92 960 127c44 30 107 25 130 73 22 45-21 82-7 127 15 48 73 74 126 71"/>
    <path d="M900 -10C862 42 875 89 915 118c38 28 91 25 112 64 19 35-14 69-3 104 12 39 57 61 100 61"/>
    <path d="M856 11C827 50 838 84 868 107c29 22 72 20 90 49 15 27-7 53 0 80 8 30 41 48 75 52"/>
    <path d="M740 590c45-35 101-38 144-10 33 22 44 62 82 80 37 18 90 12 126 38 34 25 45 57 94 62"/>
