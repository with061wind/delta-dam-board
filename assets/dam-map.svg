    <path d="M38 76l24-18M60 76l24-18M82 76l24-18M104 76l24-18M126 76l24-18M148 76l24-18"/>
    <path d="M962 634l24-18M984 634l24-18M1006 634l24-18M1028 634l24-18M1050 634l24-18M1072 634l24-18"/>
  </g>

