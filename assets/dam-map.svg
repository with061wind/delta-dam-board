  <g>
    <path d="M388 8h294c-9 50 12 80 48 108 32 25 40 55 24 92-15 33-46 43-80 46-50 4-91-24-139-17-38 6-64 29-99 23-55-11-85-62-77-120 6-44 31-72 29-132Z" fill="url(#water)" stroke="#5d938d" stroke-opacity=".34" stroke-width="1.5"/>
