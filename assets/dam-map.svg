    </g>
    <g fill="#c1ddd2" fill-opacity=".26" font-family="'Cascadia Mono','Consolas',monospace" font-size="9" letter-spacing="1.6">
      <text x="443" y="90">RESERVOIR 01</text>
      <text x="420" y="104">水位 128.4 M</text>
    </g>
  </g>

