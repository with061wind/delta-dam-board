  <g filter="url(#glow)">
    <path d="M402 395 766 395 785 423 761 452 401 452 384 423Z" fill="#412f1d" stroke="#e6aa4e" stroke-opacity=".65" stroke-width="2"/>
    <path d="M408 414h364" stroke="url(#damWall)" stroke-width="9"/>
    <path d="M408 430h364" stroke="#e3a34d" stroke-opacity=".35" stroke-width="2"/>
    <g stroke="#e3a34d" stroke-opacity=".55" stroke-width="1.4">
