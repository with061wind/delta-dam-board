    <g transform="translate(1064 140)">
      <circle r="18" fill="#0d1410" stroke="#67c0a8" stroke-opacity=".8"/>
      <circle r="25" fill="none" stroke="#67c0a8" stroke-opacity=".22"/>
      <path d="M-7 0h14M0-7v14" stroke="#67c0a8" stroke-width="1.6"/>
